<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24150D"/>
      <stop offset="100%" stop-color="#190E08"/>
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd5949"/>
      <stop offset="50%" stop-color="#d6249f"/>
      <stop offset="100%" stop-color="#285AEB"/>
    </linearGradient>
    <linearGradient id="bubbleClient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#341D12"/>
      <stop offset="100%" stop-color="#2B170E"/>
    </linearGradient>
    <linearGradient id="bubbleBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#452719"/>
      <stop offset="100%" stop-color="#381E13"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="450" height="800" rx="16" fill="url(#bgGrad)"/>
  <rect width="446" height="796" x="2" y="2" rx="14" fill="none" stroke="#D5B078" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Chat Header Bar -->
  <rect width="450" height="90" rx="16" fill="#1C100A" fill-opacity="0.95"/>
  <line x1="0" y1="90" x2="450" y2="90" stroke="#452719" stroke-width="1"/>
  
  <!-- Instagram Badge -->
  <rect x="28" y="23" width="44" height="44" rx="12" fill="url(#instaGrad)"/>
  <rect x="36" y="31" width="28" height="28" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="50" cy="45" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="57" cy="38" r="1.5" fill="#FFFFFF"/>
  
  <text x="85" y="40" font-family="'Cairo', sans-serif" font-size="16" font-weight="700" fill="#FAF7F2">Caramel Official</text>
  <text x="85" y="60" font-family="sans-serif" font-size="12" fill="#E1306C">@caramel20261 • Instagram DM</text>

  <!-- Demo Watermark Top Banner -->
  <rect x="35" y="110" width="380" height="36" rx="6" fill="#D5B078" fill-opacity="0.12" stroke="#D5B078" stroke-opacity="0.35"/>
  <text x="225" y="133" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#D5B078">نموذج معاينة تجريبي • DEMO PREVIEW</text>

  <!-- Timestamp Pill -->
  <rect x="175" y="170" width="100" height="24" rx="12" fill="#1C100A" fill-opacity="0.8"/>
  <text x="225" y="186" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B89981">أمس 6:15 PM</text>

  <!-- Client Bubble 1 -->
  <rect x="25" y="220" width="320" height="100" rx="14" fill="url(#bubbleClient)" stroke="#452719" stroke-width="1"/>
  <text x="45" y="250" font-family="'Cairo', sans-serif" font-size="14" fill="#FAF7F2">هاي حبيبتي، شفت صورة الشنطة</text>
  <text x="45" y="275" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" fill="#D5B078">Seline Crescent Shoulder Bag</text>
  <text x="45" y="302" font-family="'Cairo', sans-serif" font-size="13" fill="#E9D8C3">هل السلسلة الدهبي وزنها تقيل والجلد أصلي؟</text>

  <!-- Showroom Bubble -->
  <rect x="105" y="340" width="320" height="100" rx="14" fill="url(#bubbleBrand)" stroke="#D5B078" stroke-opacity="0.3" stroke-width="1"/>
  <text x="125" y="370" font-family="'Cairo', sans-serif" font-size="13.5" fill="#FAF7F2">أهلاً بكِ عزيزتي ✨</text>
  <text x="125" y="395" font-family="'Cairo', sans-serif" font-size="13.5" fill="#E9D8C3">الجلد ناعم وحبيباته فخمة مع طلاء دهبي</text>
  <text x="125" y="420" font-family="'Cairo', sans-serif" font-size="13.5" fill="#E9D8C3">مقاوم للتغير، وخفيفة ومريحة جداً في اللبس.</text>

  <!-- Client Review Feedback -->
  <rect x="25" y="465" width="340" height="115" rx="14" fill="url(#bubbleClient)" stroke="#452719" stroke-width="1"/>
  <text x="45" y="495" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#FAF7F2">الشنطة وصلت النهاردة تجنن بجد!</text>
  <text x="45" y="522" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" fill="#D5B078">على الطبيعة أحلى بمراحل من الصور ❤️</text>
  <text x="45" y="552" font-family="'Cairo', sans-serif" font-size="13" fill="#E9D8C3">كل صحباتي سألوني عليها.. أكيد مش آخر تعامل!</text>

  <!-- Heart Reaction -->
  <text x="345" y="590" font-size="20">❤️</text>

  <!-- Bottom Replacement Notice -->
  <rect x="30" y="700" width="390" height="65" rx="10" fill="#1C100A" fill-opacity="0.9" stroke="#744D34" stroke-dasharray="4 4"/>
  <text x="225" y="726" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#E9D8C3">مساحة مخصصة للقطة شاشة المحادثة الفعلية</text>
  <text x="225" y="748" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#B89981">Authentic Screenshot Placement • Instagram DM</text>
</svg>
